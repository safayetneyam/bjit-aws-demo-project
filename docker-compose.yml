services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${DB_BIND_ADDRESS}:${DB_HOST_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
      args:
        BACKEND_CONTAINER_PORT: ${BACKEND_CONTAINER_PORT}
    environment:
      PORT: ${BACKEND_CONTAINER_PORT}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports:
      - "${BACKEND_BIND_ADDRESS}:${BACKEND_HOST_PORT}:${BACKEND_CONTAINER_PORT}"
    expose:
      - "${BACKEND_CONTAINER_PORT}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    environment:
      BACKEND_CONTAINER_PORT: ${BACKEND_CONTAINER_PORT}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
